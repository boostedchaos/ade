name: Windows CI (ground truth)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build + smoke test - Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          # Windows build uses prebuilt natives exclusively (npmRebuild off);
          # skip @electron/rebuild, which needs a Visual Studio toolchain.
          ADE_SKIP_INSTALL_APP_DEPS: "1"
        run: bun install

      - name: Typecheck
        working-directory: apps/desktop
        run: |
          bun run generate:routes
          bunx tsc --noEmit

      - name: Unit tests (desktop, full suite vs Windows baseline)
        working-directory: apps/desktop
        # Full suite with a failure ratchet: known Windows failures live in
        # scripts/win-test-baseline.txt; only NEW failures fail this step.
        # (The old reconcile-timeout hang was root-caused to an unref'd timer
        # being the only pending handle under bun's Windows runner — fixed in
        # reconcile.ts — so the terminal suite runs again. The step timeout
        # stays as the guard: bun's per-test timeout cannot interrupt a fully
        # quiescent hang on Windows.)
        timeout-minutes: 10
        run: bun run test:win

      - name: Unit tests (control-plane)
        working-directory: packages/control-plane
        # Fresh Windows-green suite — no ratchet/baseline; any failure fails CI.
        timeout-minutes: 5
        run: bun test

      - name: Unit tests (cli)
        working-directory: packages/cli
        # Fresh Windows-green suite — no ratchet/baseline; any failure fails CI.
        timeout-minutes: 5
        run: bun test

      - name: Build Windows package (full pipeline incl. verify)
        working-directory: apps/desktop
        run: bun run build:win

      - name: "Verify packaged resources: cli, skills, hook templates"
        working-directory: apps/desktop
        shell: pwsh
        # Belt to verify-win-package.ts's suspenders: that guard checks native
        # binaries; this asserts the agent-runtime payload also shipped. cli and
        # skills are loose extraResources (electron-builder.ts); the hook
        # templates are packed INSIDE app.asar at main/templates (asar: true),
        # copied there from packages/server-core by vite/helpers.ts — so they are
        # verified by reading the asar header index, not by a loose Test-Path.
        run: |
          @'
          const fs = require("fs");
          const path = require("path");
          const resources = path.join(process.argv[2], "resources");
          const missing = [];

          for (const rel of ["cli/index.mjs", "skills/ade-workspace/SKILL.md"]) {
            const p = path.join(resources, rel);
            if (fs.existsSync(p)) console.log(`  OK (extraResource): resources/${rel}`);
            else missing.push(`resources/${rel} (loose extraResource absent)`);
          }

          const asar = path.join(resources, "app.asar");
          const templates = [
            "agent-shim.template.mjs",
            "copilot-hook.template.mjs",
            "cursor-hook.template.mjs",
            "gemini-hook.template.mjs",
            "notify-hook.template.mjs",
          ];
          if (!fs.existsSync(asar)) {
            missing.push("resources/app.asar (missing — cannot verify hook templates)");
          } else {
            // asar header: JSON length is a UInt32LE at byte 12, JSON begins at byte 16.
            const fd = fs.openSync(asar, "r");
            try {
              const head = Buffer.alloc(16);
              fs.readSync(fd, head, 0, 16, 0);
              const jsonLen = head.readUInt32LE(12);
              const json = Buffer.alloc(jsonLen);
              fs.readSync(fd, json, 0, jsonLen, 16);
              const header = json.toString("utf8");
              for (const t of templates) {
                if (header.includes(t)) console.log(`  OK (in app.asar): main/templates/${t}`);
                else missing.push(`main/templates/${t} (absent from app.asar index)`);
              }
            } finally {
              fs.closeSync(fd);
            }
          }

          if (missing.length) {
            console.error("[verify-resources] packaged agent-runtime resources missing:");
            for (const m of missing) console.error(`  - ${m}`);
            process.exit(1);
          }
          console.log("[verify-resources] OK: cli, skills, and hook templates all present");
          '@ | Set-Content verify-resources.cjs
          node verify-resources.cjs "release/win-unpacked"
          exit $LASTEXITCODE

      - name: "Smoke: native modules load under packaged Electron"
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $unpacked = "release/win-unpacked/resources/app.asar.unpacked/node_modules"
          @"
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const Database = require(path.join(root, 'better-sqlite3'));
          const db = new Database(':memory:');
          db.exec('CREATE TABLE t(x); INSERT INTO t VALUES (42)');
          const row = db.prepare('SELECT x FROM t').get();
          if (row.x !== 42) throw new Error('sqlite roundtrip failed');
          console.log('SQLITE_OK');
          const pty = require(path.join(root, 'node-pty'));
          const p = pty.spawn('powershell.exe', ['-NoProfile','-Command','echo PTY_OK_42'], { cols: 80, rows: 24, cwd: process.env.USERPROFILE, env: process.env });
          let out = '';
          p.onData(d => { out += d; });
          p.onExit(() => {
            if (!out.includes('PTY_OK_42')) { console.error('PTY output missing:', out.slice(0,200)); process.exit(1); }
            console.log('PTY_OK');
            // ConPTY teardown can crash the process AFTER our work is done,
            // corrupting the exit code — record success in a marker file and
            // let the shell judge by that, not by the exit code.
            require('fs').writeFileSync('smoke-result.txt', 'OK');
            setTimeout(() => process.exit(0), 500);
          });
          setTimeout(() => { console.error('PTY timeout'); process.exit(1); }, 30000);
          "@ | Set-Content smoke-natives.cjs
          Remove-Item -Force -ErrorAction SilentlyContinue smoke-result.txt
          $env:ELECTRON_RUN_AS_NODE = "1"
          # ADE.exe is a GUI-subsystem binary: `&` would NOT wait for it and
          # $LASTEXITCODE stays empty — Start-Process -Wait is required.
          $p = Start-Process -FilePath "release/win-unpacked/ADE.exe" -ArgumentList "smoke-natives.cjs", "`"$unpacked`"" -NoNewWindow -Wait -PassThru
          Write-Output "electron exit code: $($p.ExitCode) (informational)"
          Start-Sleep -Seconds 2
          if (!(Test-Path smoke-result.txt) -or (Get-Content smoke-result.txt) -ne 'OK') {
            Write-Error "smoke marker missing — natives smoke failed"
            exit 1
          }
          Write-Output "NATIVES_SMOKE_PASS"
          exit 0

      - name: "Smoke: packaged app boots, initializes ~/.ade, stays alive"
        working-directory: apps/desktop
        shell: pwsh
        run: |
          # Redirect the app's data dir (homedir() follows USERPROFILE) so the
          # smoke asserts real app-level init — local.db created via
          # better-sqlite3 inside the packaged app — not just "process alive".
          $smokeProfile = Join-Path $env:RUNNER_TEMP "ade-smoke-profile"
          New-Item -ItemType Directory -Force $smokeProfile | Out-Null
          $env:USERPROFILE = $smokeProfile
          $p = Start-Process -FilePath "release/win-unpacked/ADE.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "ADE.exe exited early with code $($p.ExitCode)"
            exit 1
          }
          $db = Join-Path $smokeProfile ".ade\local.db"
          if (!(Test-Path $db)) {
            Get-ChildItem -Recurse $smokeProfile | Select-Object -First 20 | Format-Table -AutoSize | Out-String | Write-Output
            Write-Error "local.db missing under $smokeProfile\.ade — app-level init failed"
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Output "APP_ALIVE_AND_DB_INITIALIZED"
          Stop-Process -Id $p.Id -Force
          exit 0

      - name: "Smoke: installed CLI launcher reaches control server over named pipe"
        working-directory: apps/desktop
        shell: pwsh
        # Self-contained (separate from the boot smoke so a failure attributes
        # cleanly): boot the packaged app under a redirected USERPROFILE, wait for
        # the control server to publish its token, then drive the cli THE WAY A
        # USER DOES — through the generated <profile>\.ade\bin\ade.cmd launcher.
        # The app and cli must resolve the same data dir + pipe: the pipe name
        # derives from the user name, while the token path follows
        # homedir()==USERPROFILE — so both processes share the redirected profile
        # and neither may see a workspace/data-dir override (scrubbed below).
        # Success = exit 0 + a listing, NOT the exit-3 "not running (no control
        # socket)" error.
        #
        # BOTH 0.4.0 FIELD BUGS ARE REPRODUCED HERE, and neither was visible to
        # the old version of this step, which ran the resources copy directly from
        # a writable checkout with USERNAME set:
        #   1. going through ade.cmd exercises the staged CLI copy under
        #      <profile>\.ade\cli — bun cannot execute the entry from the
        #      read-only install dir ("error: EPERM reading …");
        #   2. USERNAME/USER are stripped below, exactly as ADE's own agent
        #      terminals were, which makes bun's os.userInfo() answer "unknown"
        #      and forces the CLI's whoami fallback to name the pipe correctly.
        run: |
          $smokeProfile = Join-Path $env:RUNNER_TEMP "ade-cli-smoke-profile"
          New-Item -ItemType Directory -Force $smokeProfile | Out-Null
          $env:USERPROFILE = $smokeProfile
          Remove-Item Env:\SUPERSET_WORKSPACE_NAME -ErrorAction SilentlyContinue
          Remove-Item Env:\ADE_DATA_DIR_NAME -ErrorAction SilentlyContinue
          Remove-Item -Force -ErrorAction SilentlyContinue cli-smoke-result.txt

          $app = Start-Process -FilePath "release/win-unpacked/ADE.exe" -PassThru
          # The control server writes control.token once .ade is initialized; poll
          # for it as the readiness signal rather than a fixed sleep.
          $token = Join-Path $smokeProfile ".ade\control.token"
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            if (Test-Path $token) { $ready = $true; break }
            if ($app.HasExited) {
              Write-Error "ADE.exe exited early (code $($app.ExitCode)) before control.token appeared"
              exit 1
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Error "control.token never appeared under $smokeProfile\.ade — control server did not come up"
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # agent-setup writes the launcher and stages the CLI bundle during boot;
          # both land a beat after the token, so poll for the launcher too.
          $cli = Join-Path $smokeProfile ".ade\bin\ade.cmd"
          $staged = Join-Path $smokeProfile ".ade\cli\index.mjs"
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path $cli) -and (Test-Path $staged)) { break }
            Start-Sleep -Seconds 1
          }
          if (!(Test-Path $cli)) {
            Write-Error "ade launcher missing at $cli — bin injection did not run"
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          if (!(Test-Path $staged)) {
            Write-Error "CLI bundle was not staged into $staged — the launcher would point into the read-only install dir, which bun cannot execute"
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # As in an ADE agent terminal: no USERNAME, no USER.
          Remove-Item Env:\USERNAME -ErrorAction SilentlyContinue
          Remove-Item Env:\USER -ErrorAction SilentlyContinue

          function Invoke-AdeList {
            # ade.cmd runs bun (a console binary, on PATH via setup-bun) and spawns
            # no PTY for this command, so $LASTEXITCODE is reliable here — no marker
            # needed for the call itself; the marker below records the judged
            # pass/fail.
            $out = & $cli list-workspaces 2>&1 | Out-String
            return @{ Code = $LASTEXITCODE; Out = $out }
          }
          $r = Invoke-AdeList
          if ($r.Code -ne 0 -or $r.Out -match "not running") {
            # The pipe can come up a beat after the token file; allow one retry.
            Start-Sleep -Seconds 3
            $r = Invoke-AdeList
          }
          Write-Output "ade list-workspaces exit=$($r.Code)"
          Write-Output "----- output -----"
          Write-Output $r.Out
          Write-Output "------------------"
          if ($r.Code -eq 0 -and $r.Out -notmatch "not running") {
            Set-Content cli-smoke-result.txt "OK"
          }

          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (!(Test-Path cli-smoke-result.txt) -or (Get-Content cli-smoke-result.txt) -ne 'OK') {
            Write-Error "CLI pipe smoke failed — 'ade list-workspaces' did not reach the control server"
            exit 1
          }
          Write-Output "CLI_PIPE_SMOKE_PASS"
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml
          retention-days: 30

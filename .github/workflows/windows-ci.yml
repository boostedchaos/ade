name: Windows CI (ground truth)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    name: Build + smoke test - Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          # Windows build uses prebuilt natives exclusively (npmRebuild off);
          # skip @electron/rebuild, which needs a Visual Studio toolchain.
          ADE_SKIP_INSTALL_APP_DEPS: "1"
        run: bun install

      - name: Typecheck
        working-directory: apps/desktop
        run: |
          bun run generate:routes
          bunx tsc --noEmit

      - name: Unit tests (desktop, full suite vs Windows baseline)
        working-directory: apps/desktop
        # Full suite with a failure ratchet: known Windows failures live in
        # scripts/win-test-baseline.txt; only NEW failures fail this step.
        # (The old reconcile-timeout hang was root-caused to an unref'd timer
        # being the only pending handle under bun's Windows runner — fixed in
        # reconcile.ts — so the terminal suite runs again. The step timeout
        # stays as the guard: bun's per-test timeout cannot interrupt a fully
        # quiescent hang on Windows.)
        timeout-minutes: 10
        run: bun run test:win

      - name: Build Windows package (full pipeline incl. verify)
        working-directory: apps/desktop
        run: bun run build:win

      - name: "Smoke: native modules load under packaged Electron"
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $unpacked = "release/win-unpacked/resources/app.asar.unpacked/node_modules"
          @"
          const path = require('path');
          const root = path.resolve(process.argv[2]);
          const Database = require(path.join(root, 'better-sqlite3'));
          const db = new Database(':memory:');
          db.exec('CREATE TABLE t(x); INSERT INTO t VALUES (42)');
          const row = db.prepare('SELECT x FROM t').get();
          if (row.x !== 42) throw new Error('sqlite roundtrip failed');
          console.log('SQLITE_OK');
          const pty = require(path.join(root, 'node-pty'));
          const p = pty.spawn('powershell.exe', ['-NoProfile','-Command','echo PTY_OK_42'], { cols: 80, rows: 24, cwd: process.env.USERPROFILE, env: process.env });
          let out = '';
          p.onData(d => { out += d; });
          p.onExit(() => {
            if (!out.includes('PTY_OK_42')) { console.error('PTY output missing:', out.slice(0,200)); process.exit(1); }
            console.log('PTY_OK');
            // ConPTY teardown can crash the process AFTER our work is done,
            // corrupting the exit code — record success in a marker file and
            // let the shell judge by that, not by the exit code.
            require('fs').writeFileSync('smoke-result.txt', 'OK');
            setTimeout(() => process.exit(0), 500);
          });
          setTimeout(() => { console.error('PTY timeout'); process.exit(1); }, 30000);
          "@ | Set-Content smoke-natives.cjs
          Remove-Item -Force -ErrorAction SilentlyContinue smoke-result.txt
          $env:ELECTRON_RUN_AS_NODE = "1"
          # ADE.exe is a GUI-subsystem binary: `&` would NOT wait for it and
          # $LASTEXITCODE stays empty — Start-Process -Wait is required.
          $p = Start-Process -FilePath "release/win-unpacked/ADE.exe" -ArgumentList "smoke-natives.cjs", "`"$unpacked`"" -NoNewWindow -Wait -PassThru
          Write-Output "electron exit code: $($p.ExitCode) (informational)"
          Start-Sleep -Seconds 2
          if (!(Test-Path smoke-result.txt) -or (Get-Content smoke-result.txt) -ne 'OK') {
            Write-Error "smoke marker missing — natives smoke failed"
            exit 1
          }
          Write-Output "NATIVES_SMOKE_PASS"
          exit 0

      - name: "Smoke: packaged app boots, initializes ~/.ade, stays alive"
        working-directory: apps/desktop
        shell: pwsh
        run: |
          # Redirect the app's data dir (homedir() follows USERPROFILE) so the
          # smoke asserts real app-level init — local.db created via
          # better-sqlite3 inside the packaged app — not just "process alive".
          $smokeProfile = Join-Path $env:RUNNER_TEMP "ade-smoke-profile"
          New-Item -ItemType Directory -Force $smokeProfile | Out-Null
          $env:USERPROFILE = $smokeProfile
          $p = Start-Process -FilePath "release/win-unpacked/ADE.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "ADE.exe exited early with code $($p.ExitCode)"
            exit 1
          }
          $db = Join-Path $smokeProfile ".ade\local.db"
          if (!(Test-Path $db)) {
            Get-ChildItem -Recurse $smokeProfile | Select-Object -First 20 | Format-Table -AutoSize | Out-String | Write-Output
            Write-Error "local.db missing under $smokeProfile\.ade — app-level init failed"
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Output "APP_ALIVE_AND_DB_INITIALIZED"
          Stop-Process -Id $p.Id -Force
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ade-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml
          retention-days: 30
